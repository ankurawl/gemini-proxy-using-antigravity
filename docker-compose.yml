services:
  gemini-proxy:
    build: .
    container_name: gemini-proxy-using-antigravity
    ports:
      - "8000:8000"
    volumes:
      - ./proxy.py:/app/proxy.py:ro
      - ~/.gemini/antigravity-cli/:/root/.gemini/antigravity-cli/:ro
    tmpfs:
      - /root/.gemini/antigravity-cli/cache:rw,exec
      - /root/.gemini/antigravity-cli/log:rw
      - /root/.gemini/antigravity-cli/conversations:rw
      - /root/.gemini/antigravity-cli/presence:rw
      - /root/.gemini/antigravity-cli/crashes:rw
      - /root/.gemini/antigravity-cli/scratch:rw
    restart: unless-stopped
